<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" fill="#0B132B"/>
  <!-- Card base neo-brutalista con sombra dura -->
  <rect x="28" y="28" width="144" height="144" rx="4" fill="#1C2541" stroke="#38BDF8" stroke-width="4"/>
  <rect x="24" y="24" width="144" height="144" rx="4" fill="#F1F5F9" stroke="#0B132B" stroke-width="5"/>
  <!-- Icono de Casa Brutalista -->
  <path d="M96 46 L46 86 L58 86 L58 144 L80 144 L80 108 L112 108 L112 144 L134 144 L134 86 L146 86 Z" 
        fill="#1C2541" stroke="#0B132B" stroke-width="4" stroke-linejoin="round"/>
  <!-- Símbolo de Moneda / Gasto en el centro -->
  <circle cx="96" cy="84" r="14" fill="#38BDF8" stroke="#0B132B" stroke-width="3"/>
  <text x="96" y="90" font-family="monospace, sans-serif" font-size="16" font-weight="900" fill="#0B132B" text-anchor="middle">$</text>
  <!-- Barra de gráfico inferior brutalista -->
  <rect x="42" y="152" width="30" height="8" fill="#E11D48" stroke="#0B132B" stroke-width="2"/>
  <rect x="78" y="152" width="40" height="8" fill="#059669" stroke="#0B132B" stroke-width="2"/>
  <rect x="124" y="152" width="26" height="8" fill="#0284C7" stroke="#0B132B" stroke-width="2"/>
</svg>
